  <script>
    // Register custom service worker that wraps Flutter's service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').then(function(reg) {
          console.log('DueTonight custom ServiceWorker registered:', reg.scope);
        }).catch(function(err) {
          console.error('Custom ServiceWorker registration failed:', err);
        });
      });
    }

    // Web Push Notifications JS Helper
    window.dueTonightPush = {
      getPermissionStatus: function() {
        if (!('Notification' in window)) {
          return 'unsupported';
        }
        return Notification.permission; // 'default', 'granted', 'denied'
      },
      
      requestPermission: async function() {
        if (!('Notification' in window)) {
          return 'unsupported';
        }
        const permission = await Notification.requestPermission();
        return permission;
      },
      
      arrayBufferToBase64: function(buffer) {
        if (!buffer) return '';
        var binary = '';
        var bytes = new Uint8Array(buffer);
        var len = bytes.byteLength;
        for (var i = 0; i < len; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return window.btoa(binary)
          .replace(/\+/g, '-')
          .replace(/\//g, '_')
          .replace(/=+$/, '');
      },

      subscribeUser: async function(publicVapidKey) {
        if (!('serviceWorker' in navigator)) {
          throw new Error('Service worker not supported');
        }
        
        const registration = await navigator.serviceWorker.ready;
        let subscription = await registration.pushManager.getSubscription();
        
        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: window.dueTonightPush.urlBase64ToUint8Array(publicVapidKey)
          });
        }
        
        const rawSubscription = JSON.parse(JSON.stringify(subscription || {}));
        const p256dhBuffer = subscription.getKey ? subscription.getKey('p256dh') : null;
        const authBuffer = subscription.getKey ? subscription.getKey('auth') : null;
        
        const p256dhKey = p256dhBuffer 
          ? window.dueTonightPush.arrayBufferToBase64(p256dhBuffer)
          : (rawSubscription.keys ? rawSubscription.keys.p256dh : '');
        const authKey = authBuffer
          ? window.dueTonightPush.arrayBufferToBase64(authBuffer)
          : (rawSubscription.keys ? rawSubscription.keys.auth : '');
          
        if (!p256dhKey || !authKey) {
          throw new Error('Failed to extract subscription keys');
        }
        
        return {
          endpoint: subscription.endpoint,
          p256dh: p256dhKey,
          auth: authKey
        };
      },
      
      urlBase64ToUint8Array: function(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding)
          .replace(/\-/g, '+')
          .replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
          outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
      },

      // Callback-based helpers — avoid Promise interop issues
      requestPermissionWithCallback: function(onResult) {
        this.requestPermission().then(function(result) {
          onResult(result);
        }).catch(function(err) {
          onResult('denied');
        });
      },
      subscribeWithCallback: function(publicVapidKey, onSuccess, onError) {
        console.log('[Push] subscribeWithCallback called');
        var self = this;
        // Check service worker state first
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(function(reg) {
            console.log('[Push] SW ready, state:', reg.active ? reg.active.state : 'no active');
          }).catch(function(err) {
            console.log('[Push] SW ready failed:', err);
          });
        } else {
          console.log('[Push] no serviceWorker in navigator');
        }
        // Try subscription with timeout
        var timedOut = false;
        var timer = setTimeout(function() {
          timedOut = true;
          console.log('[Push] subscribeUser timed out after 30s (JS side)');
          onError('JS-side timeout');
        }, 30000);
        self.subscribeUser(publicVapidKey)
          .then(function(result) {
            if (timedOut) return;
            clearTimeout(timer);
            console.log('[Push] subscribeUser resolved successfully');
            onSuccess(JSON.stringify(result));
          })
          .catch(function(err) {
            if (timedOut) return;
            clearTimeout(timer);
            console.log('[Push] subscribeUser rejected:', err.message || String(err));
            onError(err.message || String(err));
          });
      }
    };
